<div class="col">
    <div class="card h-100 border-0 shadow-sm product-card overflow-hidden">
        <!-- Image Container -->
        <a href="{% url 'product_detail' product.id %}" class="position-relative d-block text-decoration-none">
            <div class="bg-light ratio ratio-4x3 d-flex align-items-center justify-content-center">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid"
                    style="object-fit: cover; width: 100%; height: 100%;" alt="{{ product.title }}">
                {% else %}
                <i class="bi bi-card-image display-4 text-muted opacity-25 m-auto"></i>
                {% endif %}
            </div>

            <!-- Category Badge -->
            {% if product.category %}
            <span class="position-absolute top-0 start-0 m-2 badge bg-white text-dark shadow-sm">
                {{ product.category.name }}
            </span>
            {% endif %}

            <!-- Stock Badge -->
            <span
                class="position-absolute top-0 end-0 m-2 badge {% if product.stock_quantity == 0 %}bg-danger{% elif product.stock_quantity <= 2 %}bg-warning text-dark{% else %}d-none{% endif %} shadow-sm">
                {% if product.stock_quantity == 0 %}Sold Out{% else %}Low Stock{% endif %}
            </span>
        </a>

        <div class="card-body">
            <h5 class="card-title fw-bold text-truncate mb-1">
                <a href="{% url 'product_detail' product.id %}" class="text-dark text-decoration-none">{{ product.title
                    }}</a>
            </h5>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-primary fw-bold fs-5">₹{{ product.price_per_day }}<span
                        class="text-muted fs-6 fw-normal">/day</span></span>

                <small class="text-muted d-flex align-items-center">
                    <i class="bi bi-person me-1"></i> {{ product.owner.username }}
                </small>
            </div>
        </div>

        <div class="card-footer bg-white border-0 pt-0 pb-3">
            <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-primary w-100 rounded-pill">View
                Details</a>
        </div>
    </div>
</div>
